*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07030f;color:var(--white)}
body{font-family:'VT323',monospace;font-size:22px;min-height:100vh;display:flex;flex-direction:column;align-items:center}

h1{font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(28px,8vw,44px);margin:8px 0 0;letter-spacing:2px;color:#fff;

.sub{margin:10px 0 14px;color:var(--lilac);font-size:26px;text-align:center;text-shadow:2px 2px 0 #1b0b3a}
.links{width:100%;display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:10px 14px 10px 10px;text-decoration:none;color:var(--ink);

.btn:hover,.btn:focus-visible{background:#fff;transform:translateY(-2px);outline:none;box-shadow:inset -4px -4px 0 #a78bf5, inset 4px 4px 0 #fff, 0 8px 0 var(--violet-d), 0 0 0 4px var(--violet)}

.ico svg{width:32px;height:32px;fill:#fff;display:block}
.ico img{width:100%;height:100%;display:block;image-rendering:pixelated}
.ico.plain{padding:0;background:#111;border-color:var(--ink)}
.txt{display:flex;flex-direction:column;min-width:0}

.counter[hidden]{display:none}
.counter svg{width:20px;height:20px;fill:var(--violet);flex:none}
.counter b{font-weight:400;font-size:13px;color:var(--violet)}
/* ekran wejscia - pojawia sie TYLKO gdy przegladarka blokuje autoodtwarzanie z dzwiekiem (potrzebny jest 1 klik) */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(7,3,15,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#gate button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 30px;max-width:100%;text-align:center;color:var(--ink);
  background:var(--face);border:4px solid var(--ink);box-shadow:inset -4px -4px 0 #b9a2f2, inset 4px 4px 0 #fff, 0 6px 0 var(--violet-d)}
#gate button:hover,#gate button:focus-visible{background:#fff;outline:4px solid var(--violet);outline-offset:4px}
#gate button:active{transform:translateY(4px)}
#gate .t{font-family:'Press Start 2P',monospace;font-size:clamp(16px,5vw,22px);line-height:1.4}
#gate .s{font-size:22px;color:#5a3fa8;line-height:1.1}

#music{position:fixed;top:12px;right:12px;z-index:5;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--face);border:4px solid var(--ink);
  box-shadow:inset -3px -3px 0 #b9a2f2, inset 3px 3px 0 #fff, 0 4px 0 var(--violet-d)}
#mute{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;background:var(--violet);border:3px solid var(--ink)}
#mute:focus-visible{box-shadow:0 0 0 3px #fff}
#mute svg{width:20px;height:20px;fill:#fff}
#vol{-webkit-appearance:none;appearance:none;width:96px;height:14px;background:var(--ink);border:2px solid var(--ink);outline:none;cursor:pointer;margin:0}
#vol::-webkit-slider-runnable-track{height:10px;background:linear-gradient(90deg,var(--violet) var(--p,40%),#3a2a66 var(--p,40%))}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:22px;margin-top:-6px;background:#fff;border:3px solid var(--ink)}
#vol::-moz-range-track{height:10px;background:#3a2a66}
#vol::-moz-range-progress{height:10px;background:var(--violet)}
#vol::-moz-range-thumb{width:8px;height:18px;background:#fff;border:3px solid var(--ink);border-radius:0}
#vol:focus-visible::-webkit-slider-thumb{background:var(--lilac)}
@media (max-width:520px){#vol{width:70px}.name{font-size:11px}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* ===== WIDEO W TLE + DZWIEK Z background.mp4 =====
   Dzwiek pochodzi z samego wideo. Przegladarki blokuja autoodtwarzanie z dzwiekiem, dopoki uzytkownik
   nie kliknie na stronie - wtedy pokazujemy ekran "Wejdz"; klikniecie od razu uruchamia wideo z dzwiekiem. */
(function(){
  var v=document.getElementById('bg'), vol=document.getElementById('vol'), mute=document.getElementById('mute');
  var on=document.getElementById('icoOn'), off=document.getElementById('icoOff');
  if(!v) return;
  var userMuted=false, blocked=false, gate=null;
  function showGate(){ if(gate) return; gate=document.createElement('div'); gate.id='gate'; gate.setAttribute('role','dialog'); gate.setAttribute('aria-label','Wejście na stronę');
    gate.innerHTML='<button type="button"><span class="t">Wejdź</span><span class="s">Kliknij, aby wejść z dźwiękiem</span></button>'; document.body.appendChild(gate); try{gate.firstChild.focus();}catch(e){} }
  function hideGate(){ if(gate){ gate.remove(); gate=null; } }
  /* domyslnie dzwiek jest WLACZONY przy kazdym wejsciu (wyciszenie nie jest zapamietywane); zapamietujemy tylko poziom glosnosci > 0 */
  try{var sv=parseInt(localStorage.getItem('wv-vol'),10); if(sv>0&&sv<=100) vol.value=sv;}catch(e){}
  function wantMuted(){return userMuted||vol.value==0;}
  function paint(){
    v.volume=vol.value/100;
    v.muted=blocked||wantMuted();
    vol.style.setProperty('--p',vol.value+'%');
    var m=wantMuted(); on.style.display=m?'none':''; off.style.display=m?'':'none';
    mute.setAttribute('aria-label',m?'Włącz dźwięk':'Wycisz dźwięk');
    try{if(vol.value>0) localStorage.setItem('wv-vol',vol.value);}catch(e){}
  }
  function unlock(){ if(!blocked) return false; blocked=false; hideGate(); paint(); var p=v.play(); if(p&&p.catch) p.catch(function(){}); return true; }
  function start(){
    paint();
    var p=v.play();
    if(p&&p.catch) p.catch(function(){ blocked=true; paint(); showGate(); var q=v.play(); if(q&&q.catch) q.catch(function(){}); });
  }
  vol.addEventListener('input',function(){ if(vol.value>0) userMuted=false; unlock(); paint(); });
  mute.addEventListener('click',function(){ if(unlock()) return; userMuted=!wantMuted(); if(!userMuted&&vol.value==0) vol.value=40; paint(); });
